%YAML 1.2
---
$id: http://devicetree.org/schemas/mmc/samsung,hamcop-sdi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung HAMCOP SD/MMC host

maintainers:
  - Koen Kooi <koen@dominion.thruhere.net>

description:
  SD/MMC host cell of the Samsung HAMCOP companion ASIC. It is a child node
  of the HAMCOP node and has no register window or interrupt of its own; both
  come from the parent. The card-detect line is not a HAMCOP register but a
  GPIO of the SoC the board wires to the slot.

allOf:
  - $ref: /schemas/mmc/mmc-controller.yaml#

properties:
  compatible:
    const: samsung,hamcop-sdi

required:
  - compatible

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    companion-chip {
        mmc {
            compatible = "samsung,hamcop-sdi";
            cd-gpios = <&gpio 8 GPIO_ACTIVE_LOW>;
        };
    };
