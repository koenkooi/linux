%YAML 1.2
---
$id: http://devicetree.org/schemas/pcmcia/hp,ipaq-h3900-pcmcia.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: HP iPAQ h3900 CompactFlash sockets

maintainers:
  - Koen Kooi <koen@dominion.thruhere.net>

description: |
  The CompactFlash sockets of the HP iPAQ h3900 family. The h3900 has no
  slot of its own: the sockets sit in an expansion pack ("sleeve" or
  "option jacket") clipped onto the base connector, and their address and
  data signals pass straight through to the PXA25x's own PC Card sockets,
  whose pins the board muxes. The node has no register window or interrupt
  of its own and describes the control lines around that interface. The
  driver registers the sockets only once a pack that carries a
  CompactFlash or PC Card slot has been detected.

  Card detect and the card's ready/interrupt request line are SoC GPIO
  inputs, one pair per socket. Only the first socket has a reset line of
  its own.

properties:
  $nodename:
    const: pcmcia

  compatible:
    const: hp,ipaq-h3900-pcmcia

  detect-gpios:
    maxItems: 1
    description:
      Card detect of socket 0 (PCMCIA_CD0_N), low while a card is seated.
      It reads as low only after the pack is powered. Must be usable as an
      interrupt source.

  ready-gpios:
    maxItems: 1
    description:
      Ready/busy for memory cards and interrupt request for I/O cards of
      socket 0 (PCMCIA_IRQ0_N). Must be usable as an interrupt source.

  detect1-gpios:
    maxItems: 1
    description:
      Card detect of socket 1 (PCMCIA_CD1_N), low while a card is seated.
      Must be usable as an interrupt source.

  ready1-gpios:
    maxItems: 1
    description:
      Ready/busy for memory cards and interrupt request for I/O cards of
      socket 1 (PCMCIA_IRQ1_N). Must be usable as an interrupt source.

  reset-gpios:
    maxItems: 1
    description:
      The reset of the card in socket 0 (OPT_PCM_RESET), as opposed to the
      reset of the whole pack that the sleeve node describes.

required:
  - compatible
  - detect-gpios
  - ready-gpios
  - detect1-gpios
  - ready1-gpios
  - reset-gpios

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    pcmcia {
        compatible = "hp,ipaq-h3900-pcmcia";

        detect-gpios = <&gpio 3 GPIO_ACTIVE_LOW>;
        ready-gpios = <&gpio 7 GPIO_ACTIVE_HIGH>;
        detect1-gpios = <&gpio 12 GPIO_ACTIVE_LOW>;
        ready1-gpios = <&gpio 13 GPIO_ACTIVE_HIGH>;
        reset-gpios = <&gpio 8 GPIO_ACTIVE_HIGH>;
    };
...
