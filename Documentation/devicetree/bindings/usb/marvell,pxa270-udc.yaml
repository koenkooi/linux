%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/marvell,pxa270-udc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Marvell PXA27x USB Device Controller (UDC)

maintainers:
  - Koen Kooi <koen@dominion.thruhere.net>

description: >-
  The full-speed USB Device Controller integrated in the PXA27x application
  processors: endpoint zero and up to 23 configurable endpoints whose type,
  direction and packet size are assigned by software, and an integrated
  transceiver. This is a different block from the PXA25x UDC, which has
  fixed endpoints and its own binding. The D+ pullup resistor is not part of
  the controller; boards that switch it from a GPIO describe that line here.
  The controller connects to the host only while VBUS is present, which is
  reported by the device referenced by usb-phy.

properties:
  compatible:
    const: marvell,pxa270-udc

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  gpios:
    maxItems: 1
    description:
      GPIO that connects the D+ pullup resistor, making the device visible
      to the USB host when asserted.

  usb-phy:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Phandle of the device that senses VBUS on the USB connector and reports
      its presence or loss to the controller.

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - usb-phy

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/pxa-clock.h>
    #include <dt-bindings/gpio/gpio.h>

    usb_connector: connector {
        compatible = "gpio-usb-b-connector", "usb-b-connector";
        vbus-gpios = <&asic3 62 GPIO_ACTIVE_LOW>;
    };

    udc@40600000 {
        compatible = "marvell,pxa270-udc";
        reg = <0x40600000 0x10000>;
        interrupts = <11>;
        clocks = <&clks CLK_USB>;
        gpios = <&gpio 76 GPIO_ACTIVE_HIGH>;
        usb-phy = <&usb_connector>;
    };

...
