%YAML 1.2
---
$id: http://devicetree.org/schemas/leds/htc,asic3-leds.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: LED driver for the Compaq/HTC ASIC3 companion ASIC

maintainers:
  - Koen Kooi <koen@dominion.thruhere.net>

description:
  This module is part of the ASIC3 MFD device, see
  Documentation/devicetree/bindings/mfd/htc,asic3.yaml. The LED
  controller is represented as a sub-node of the ASIC3 node.

  ASIC3 has three independent, hardware-blink-capable LED channels, each
  with its own duty-cycle and period timer, switched via a timebase
  register rather than a plain GPIO output.

properties:
  compatible:
    const: htc,asic3-leds

  "#address-cells":
    const: 1

  "#size-cells":
    const: 0

patternProperties:
  "^led@[0-2]$":
    type: object
    $ref: common.yaml#
    unevaluatedProperties: false

    properties:
      reg:
        description:
          Index of the LED channel (ASIC3_LED0/1/2_Base).
        minimum: 0
        maximum: 2

required:
  - compatible
  - "#address-cells"
  - "#size-cells"

additionalProperties: false

examples:
  - |
    #include <dt-bindings/leds/common.h>

    companion-chip {
        led-controller {
            compatible = "htc,asic3-leds";
            #address-cells = <1>;
            #size-cells = <0>;

            led@0 {
                reg = <0>;
                function = LED_FUNCTION_POWER;
                color = <LED_COLOR_ID_AMBER>;
            };

            led@1 {
                reg = <1>;
                function = LED_FUNCTION_STATUS;
                color = <LED_COLOR_ID_GREEN>;
            };

            led@2 {
                reg = <2>;
                function = LED_FUNCTION_BLUETOOTH;
                color = <LED_COLOR_ID_BLUE>;
            };
        };
    };
