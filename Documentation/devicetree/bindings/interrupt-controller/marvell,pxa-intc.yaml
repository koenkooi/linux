%YAML 1.2
---
$id: http://devicetree.org/schemas/interrupt-controller/marvell,pxa-intc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Marvell PXA on-chip interrupt controller

maintainers:
  - Koen Kooi <koen@dominion.thruhere.net>

description:
  The interrupt controller integrated in the PXA25x, PXA27x and PXA3xx
  application processors (formerly Intel XScale-based). It collects the
  interrupt sources of the on-chip peripherals, including the shared lines of
  the GPIO block, and presents them to the IRQ input of the CPU core. It is
  the root of the interrupt tree and has no parent interrupt controller.
  Interrupt sources are numbered from 0 and the controller registers are
  organised in banks of 32 sources.

allOf:
  - $ref: /schemas/interrupt-controller.yaml#

properties:
  compatible:
    const: marvell,pxa-intc

  reg:
    maxItems: 1

  interrupt-controller: true

  '#interrupt-cells':
    const: 1
    description:
      The single cell is the number of the interrupt source.

  marvell,intc-nr-irqs:
    description:
      Number of interrupt sources implemented by the controller. This is 32 on
      the PXA25x, 34 on the PXA27x and 56 on the PXA3xx.
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 1
    maximum: 96

  marvell,intc-priority:
    description:
      Present when the per-source interrupt priority registers are to be
      programmed. Each source is then assigned a distinct priority, and the
      registers are saved and restored across suspend.
    type: boolean

required:
  - compatible
  - reg
  - interrupt-controller
  - '#interrupt-cells'
  - marvell,intc-nr-irqs

unevaluatedProperties: false

examples:
  - |
    interrupt-controller@40d00000 {
        compatible = "marvell,pxa-intc";
        reg = <0x40d00000 0xd0>;
        interrupt-controller;
        #interrupt-cells = <1>;
        marvell,intc-nr-irqs = <34>;
        marvell,intc-priority;
    };

  - |
    interrupt-controller@40d00000 {
        compatible = "marvell,pxa-intc";
        reg = <0x40d00000 0xd0>;
        interrupt-controller;
        #interrupt-cells = <1>;
        marvell,intc-nr-irqs = <32>;
        marvell,intc-priority;
    };
