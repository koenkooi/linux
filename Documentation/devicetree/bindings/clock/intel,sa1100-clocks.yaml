%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/intel,sa1100-clocks.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Intel SA-1100/SA-1110 clock controller

maintainers:
  - Koen Kooi <koen@dominion.thruhere.net>

description: |
  The Intel StrongARM SA-1100 and SA-1110 are clocked from two crystal
  oscillators: 3.6864 MHz on the PXTAL/PEXTAL pins, the reference of the
  core clock PLL, and 32.768 kHz on the TXTAL/TEXTAL pins, which clocks the
  power manager and the real-time clock. Both are board components and are
  described as separate fixed clocks.

  The clock controls of the chip are two registers in two different
  blocks:

  - The power manager PLL configuration register (PPCR) selects the core
    clock (CCLK) frequency as a multiple of the 3.6864 MHz reference
    through its CCF field. The LCD controller, the PC Card timing and the
    memory clock are derived from CCLK.

  - The test unit control register (TUCR) of the reset controller selects,
    through its TSEL field, which internal clock is driven on GPIO27 when
    that pin is switched to its alternate output function. TSEL values 0-7
    select the 32.768 kHz oscillator, the 3.6864 MHz oscillator, the VDD
    ring oscillator divided by 16, the 96 MHz PLL divided by 4, the
    32.768 kHz oscillator while also enabling the RCLK output on GPIO26,
    the 3.6864 MHz oscillator again, the main PLL divided by 16 and the
    VDDL ring oscillator divided by 4. Each TSEL value is a separate input
    clock of the GPIO27 output, so a board selects the value it needs with
    assigned-clock-parents; in particular TSEL 1 and 5 both provide the
    3.6864 MHz oscillator but are distinct parents. The ring oscillator
    taps have no specified frequency. TUCR also holds the memory request
    mode (MR) and power management disable (PMD) bits, which are not clock
    controls.

  The pin multiplexing of GPIO26 and GPIO27 belongs to the pin controller;
  this block only selects the clock those pins carry.

  The clock specifier is one of the indices in
  include/dt-bindings/clock/intel,sa1100-clocks.h.

properties:
  compatible:
    items:
      - const: intel,sa1110-clocks
      - const: intel,sa1100-clocks

  reg:
    items:
      - description: power manager PLL configuration register (PPCR)
      - description: test unit control register (TUCR)

  reg-names:
    items:
      - const: ppcr
      - const: tucr

  clocks:
    items:
      - description: 3.6864 MHz crystal oscillator (PXTAL)
      - description: 32.768 kHz crystal oscillator (TXTAL)

  clock-names:
    items:
      - const: pxtal
      - const: txtal

  "#clock-cells":
    const: 1

required:
  - compatible
  - reg
  - reg-names
  - clocks
  - clock-names
  - "#clock-cells"

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/intel,sa1100-clocks.h>

    clks: clock-controller@90020014 {
        compatible = "intel,sa1110-clocks", "intel,sa1100-clocks";
        reg = <0x90020014 0x4>, <0x90030008 0x4>;
        reg-names = "ppcr", "tucr";
        clocks = <&osc3m6>, <&osc32k>;
        clock-names = "pxtal", "txtal";
        #clock-cells = <1>;
        assigned-clocks = <&clks SA1100_CLK_GPIO27>;
        assigned-clock-parents = <&clks SA1100_CLK_TSEL_OSC3M6_ALT>;
    };

...
