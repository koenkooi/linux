%YAML 1.2
---
$id: http://devicetree.org/schemas/pcmcia/hp,ipaq-h2200-pcmcia.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: HP iPAQ h2200 CompactFlash socket

maintainers:
  - Koen Kooi <koen@dominion.thruhere.net>

description: |
  The single CompactFlash socket of the HP iPAQ h2200, wired to the first
  of the PXA25x's PC Card sockets. The card's address and data signals
  ride the SoC's own PC Card interface, whose pins the board muxes, so the
  node has no register window or interrupt of its own. It describes only
  the board wiring around that interface, all of it plain SoC GPIO lines.

  Card detect and the card's ready/interrupt request line are inputs. The
  card's reset and three enables, gating the socket's Vcc supply and its
  address and data buffers, are outputs.

properties:
  $nodename:
    const: pcmcia

  compatible:
    const: hp,ipaq-h2200-pcmcia

  detect-gpios:
    maxItems: 1
    description:
      Card detect (CF_DETECT_N), low while a card is seated. Must be usable
      as an interrupt source so that insertion and removal are noticed.

  ready-gpios:
    maxItems: 1
    description:
      The card's ready/busy indication for memory cards and interrupt
      request for I/O cards (CF_INT_N). Must be usable as an interrupt
      source.

  reset-gpios:
    maxItems: 1
    description:
      The card's RESET pin (CF_RESET).

  power-gpios:
    maxItems: 1
    description:
      Enable for the socket's Vcc supply (CF_POWER_EN).

  add-en-gpios:
    maxItems: 1
    description:
      Enable for the buffers between the SoC address lines and the socket
      (CF_ADD_EN_N), an active-low pin.

  buff-en-gpios:
    maxItems: 1
    description:
      Enable for the buffers between the SoC data lines and the socket
      (CF_BUFF_EN).

required:
  - compatible
  - detect-gpios
  - ready-gpios
  - reset-gpios
  - power-gpios
  - add-en-gpios
  - buff-en-gpios

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    pcmcia {
        compatible = "hp,ipaq-h2200-pcmcia";

        detect-gpios = <&gpio 9 GPIO_ACTIVE_LOW>;
        ready-gpios = <&gpio 7 GPIO_ACTIVE_HIGH>;
        reset-gpios = <&gpio 23 GPIO_ACTIVE_HIGH>;
        power-gpios = <&gpio 26 GPIO_ACTIVE_HIGH>;
        add-en-gpios = <&gpio 25 GPIO_ACTIVE_LOW>;
        buff-en-gpios = <&gpio 63 GPIO_ACTIVE_HIGH>;
    };
...
