%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/marvell,pxa-ohci.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Marvell PXA27x/PXA3xx USB OHCI Host Controller

maintainers:
  - Koen Kooi <koen@dominion.thruhere.net>

description: >-
  The USB host controller integrated in the PXA27x and PXA3xx application
  processors: an OHCI-compliant controller for low and full speed devices
  with a root hub of three downstream ports and on-chip transceivers. Beyond
  the OHCI register set, the block has vendor registers that select the
  polarity of the port power control and power sense signals, the over-current
  protection scheme and which downstream ports are in use.

allOf:
  - $ref: usb-hcd.yaml#

properties:
  compatible:
    const: marvell,pxa-ohci

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  vbus1-supply:
    description:
      Regulator switching VBUS of downstream port 1. It is enabled when the
      root hub powers the port on and disabled when it powers the port off.

  vbus2-supply:
    description:
      Regulator switching VBUS of downstream port 2. It is enabled when the
      root hub powers the port on and disabled when it powers the port off.

  vbus3-supply:
    description:
      Regulator switching VBUS of downstream port 3. It is enabled when the
      root hub powers the port on and disabled when it powers the port off.

  marvell,enable-port1:
    type: boolean
    description: Downstream port 1 is wired to a connector and is enabled.

  marvell,enable-port2:
    type: boolean
    description: Downstream port 2 is wired to a connector and is enabled.

  marvell,enable-port3:
    type: boolean
    description: Downstream port 3 is wired to a connector and is enabled.

  marvell,port-mode:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [1, 2, 3]
    description: |
      Port power switching mode of the root hub.
        1 - ports are not power switched and are powered continuously
        2 - all ports are power switched together
        3 - each port is power switched individually
      Without this property the ports are treated as powered continuously.

  marvell,port-sense-low:
    type: boolean
    description:
      The power sense input of the ports is active low. Without this property
      it is active high.

  marvell,power-control-low:
    type: boolean
    description:
      The port power control output is active low. Without this property it
      is active high.

  marvell,no-oc-protection:
    type: boolean
    description:
      The board has no over-current protection, so the root hub does not
      report over-current conditions.

  marvell,oc-mode-perport:
    type: boolean
    description:
      Over-current is sensed and reported for each port individually. Without
      this property it is sensed for all ports together.

  marvell,power-on-delay:
    $ref: /schemas/types.yaml#/definitions/uint32
    maximum: 510
    description:
      Time in milliseconds from switching a port on until its power is good.
      The root hub descriptor holds this time in units of 2 ms, so odd values
      are rounded down. Zero or absence keeps the hardware default.

  marvell,power-budget:
    $ref: /schemas/types.yaml#/definitions/uint32
    description:
      Total current in milliamperes that the downstream ports can supply to
      the attached devices. Zero or absence means no limit.

required:
  - compatible
  - reg
  - interrupts
  - clocks

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/pxa-clock.h>

    usb@4c000000 {
        compatible = "marvell,pxa-ohci";
        reg = <0x4c000000 0x10000>;
        interrupts = <3>;
        clocks = <&clks CLK_USBHOST>;
        marvell,enable-port1;
        marvell,port-mode = <2>;
    };

...
