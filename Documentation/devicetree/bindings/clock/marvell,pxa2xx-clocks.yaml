%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/marvell,pxa2xx-clocks.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Marvell PXA25x, PXA27x and PXA3xx Clock Controllers

maintainers:
  - Koen Kooi <koen@dominion.thruhere.net>

description: |
  The clock and power manager block of the Marvell (formerly Intel) PXA25x,
  PXA27x and PXA3xx application processors. It holds the oscillator and PLL
  configuration and the clock enable register that gates the clocks of the
  on-chip peripherals. The core, system bus and memory clocks are derived from
  the PLLs by fixed and programmable dividers.

  Each clock is assigned an identifier, and client nodes use this identifier
  as the cell of their "clocks" property to select the clock they consume.
  The identifiers are found in <dt-bindings/clock/pxa-clock.h>. Which of them
  exist depends on the SoC family.

properties:
  compatible:
    enum:
      - marvell,pxa250-core-clocks # PXA250, PXA255 and PXA26x
      - marvell,pxa270-clocks # PXA27x
      - marvell,pxa300-clocks # PXA300, PXA310, PXA320 and PXA93x

  '#clock-cells':
    const: 1
    description:
      The cell is a clock identifier from <dt-bindings/clock/pxa-clock.h>.

required:
  - compatible
  - '#clock-cells'

additionalProperties: false

examples:
  - |
    clock-controller {
        compatible = "marvell,pxa270-clocks";
        #clock-cells = <1>;
    };
