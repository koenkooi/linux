%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/asahi-kasei,ak4535.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Asahi Kasei AK4535 audio CODEC

maintainers:
  - Koen Kooi <koen@dominion.thruhere.net>

description: >-
  AK4535 is an I2C-controlled stereo audio CODEC with a separate I2S (or
  MSB-justified) digital audio interface, found on the HP iPAQ h5xxx
  (h51xx/h54xx/h55xx) among other mid-2000s PDA designs. It has no reset
  pin and no supply-enable of its own: any supply and mute switching is a
  board-level function, and the chip must already be powered before its
  registers are accessed.

properties:
  compatible:
    const: asahi-kasei,ak4535

  reg:
    maxItems: 1

  "#sound-dai-cells":
    const: 0

required:
  - compatible
  - reg

unevaluatedProperties: false

allOf:
  - $ref: dai-common.yaml#

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        codec@10 {
            compatible = "asahi-kasei,ak4535";
            reg = <0x10>;

            #sound-dai-cells = <0>;
        };
    };
