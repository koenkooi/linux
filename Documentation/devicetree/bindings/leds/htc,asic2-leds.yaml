%YAML 1.2
---
$id: http://devicetree.org/schemas/leds/htc,asic2-leds.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: LED driver for the Compaq/HTC ASIC2 companion ASIC

maintainers:
  - Koen Kooi <koen@dominion.thruhere.net>

description:
  This module is part of the ASIC2 MFD device, see htc,asic2.yaml. The LED
  controller is represented as a sub-node of the ASIC2 node, in the same way
  as that of htc,asic3-leds.yaml.

  ASIC2 has three independent LED channels with hardware blink, each with
  its own duty cycle and period timer, switched through a timebase register
  rather than a plain GPIO output. It is the same LED block as that of ASIC3
  at different register offsets.

properties:
  compatible:
    const: htc,asic2-leds

  "#address-cells":
    const: 1

  "#size-cells":
    const: 0

patternProperties:
  "^led@[0-2]$":
    type: object
    $ref: common.yaml#
    unevaluatedProperties: false

    properties:
      reg:
        description:
          Index of the LED channel.
        minimum: 0
        maximum: 2

required:
  - compatible
  - "#address-cells"
  - "#size-cells"

additionalProperties: false

examples:
  - |
    #include <dt-bindings/leds/common.h>

    companion-chip {
        led-controller {
            compatible = "htc,asic2-leds";
            #address-cells = <1>;
            #size-cells = <0>;

            led@0 {
                reg = <0>;
                function = LED_FUNCTION_BLUETOOTH;
                color = <LED_COLOR_ID_BLUE>;
            };

            led@1 {
                reg = <1>;
                function = LED_FUNCTION_STATUS;
                color = <LED_COLOR_ID_GREEN>;
                linux,default-trigger = "heartbeat";
            };

            led@2 {
                reg = <2>;
                function = LED_FUNCTION_CHARGING;
                color = <LED_COLOR_ID_AMBER>;
            };
        };
    };
