%YAML 1.2
---
$id: http://devicetree.org/schemas/pinctrl/intel,sa1100-pinctrl.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Intel SA-1100/SA-1110 pin controller

maintainers:
  - Koen Kooi <koen@dominion.thruhere.net>

description: >-
  The SA-1100/SA-1110 SoC's pin-multiplexing block: one flat 32-bit GAFR
  register, one BOOLEAN bit per pin enabling that pin's single alternate
  peripheral function -- not a multi-bit mux-select field like PXA's
  GAFRn_x -- paired with one bit per pin in GPDR for direction. 28 pins,
  P0-P27; bits 28-31 of both registers are reserved. Most pins have exactly
  one fixed alternate function, so no per-pin multi-way function selection
  exists on this silicon.

  No PIN_CONFIG_* parameter of any kind is supported: the eight registers
  at this block's fixed offset (GPLR/GPDR/GPSR/GPCR/GRER/GFER/GEDR/GAFR)
  are all there is -- unlike PXA's equivalent block, there is no
  PGSR-style sleep-state register anywhere in it. In particular there is
  no "low-power-mode" property on this binding.

  P21 and P22's several named functions below all share one GAFR bit
  each -- which real pad function a board actually gets is selected by
  TUCR_TIC/TUCR_MR, which this controller does not touch. P27's
  "32_768kHz" function drives the pin with the internal clock that the
  TSEL field of TUCR selects, the 32.768 kHz oscillator after reset; TSEL
  itself belongs to the clock controller, not to this block.

properties:
  compatible:
    items:
      - const: intel,sa1110-pinctrl
      - const: intel,sa1100-pinctrl

  reg:
    minItems: 2
    maxItems: 2

  reg-names:
    items:
      - const: gafr
      - const: gpdr

patternProperties:
  "-pins$":
    type: object
    $ref: pinmux-node.yaml#
    additionalProperties: false

    properties:
      pins:
        description:
          One or more of the 28 pin names below.
        items:
          pattern: "^P(1?[0-9]|2[0-7])$"

      function:
        enum: [gpio_in, gpio_out, LDD, SSP_TXD, SSP_RXD, SSP_SCLK, SSP_SFRM,
               UART_TXD, UART_RXD, SDLC_SCLK, SDLC_AAF, UART_SCLK1, SSP_CLK,
               UART_SCLK3, MCP_CLK, TIC_ACK, MBGNT, TREQA, MBREQ, TREQB,
               1Hz, RCLK, 32_768kHz]

    required:
      - pins
      - function

required:
  - compatible
  - reg
  - reg-names

additionalProperties: false

examples:
  - |
    pinctrl@9004001c {
        compatible = "intel,sa1110-pinctrl", "intel,sa1100-pinctrl";
        reg = <0x9004001c 0x4>, <0x90040004 0x4>;
        reg-names = "gafr", "gpdr";

        lcd-data-pins {
            pins = "P2", "P3", "P4", "P5", "P6", "P7", "P8", "P9";
            function = "LDD";
        };
    };

...
