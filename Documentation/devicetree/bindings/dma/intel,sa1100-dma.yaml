%YAML 1.2
---
$id: http://devicetree.org/schemas/dma/intel,sa1100-dma.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Intel SA-1100/SA-1110 DMA controller

maintainers:
  - Koen Kooi <koen@dominion.thruhere.net>

description: >-
  The six-channel DMA controller of the SA-1100 and SA-1110. Every channel
  is a fixed, silicon-wired slave peripheral rather than a general-purpose
  engine channel: "#dma-cells" is the 4-bit DDAR "device select" field
  (0 = Ser0UDCTr ... 14 = Ser4SSPTr, 15 = Ser4SSPRc), not a physical
  channel number. A consumer names the peripheral it wants, and the
  controller picks whichever of the six physical channels is free.

allOf:
  - $ref: dma-controller.yaml#

properties:
  compatible:
    items:
      - const: intel,sa1110-dma
      - const: intel,sa1100-dma

  reg:
    maxItems: 1

  interrupts:
    minItems: 6
    maxItems: 6
    description: One line per physical channel, channels 0-5 in order.

  "#dma-cells":
    const: 1

required:
  - compatible
  - reg
  - interrupts
  - "#dma-cells"

unevaluatedProperties: false

examples:
  - |
    dma: dma-controller@b0000000 {
        compatible = "intel,sa1110-dma", "intel,sa1100-dma";
        reg = <0xb0000000 0xc0>;
        interrupts = <20>, <21>, <22>, <23>, <24>, <25>;
        #dma-cells = <1>;
    };

...
