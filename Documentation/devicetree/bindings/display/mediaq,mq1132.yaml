%YAML 1.2
---
$id: http://devicetree.org/schemas/display/mediaq,mq1132.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: MediaQ MQ11xx display controllers

maintainers:
  - Koen Kooi <koen@dominion.thruhere.net>

description:
  The MediaQ MQ1132 and MQ1178/MQ1188 are external display controllers
  used on several early-2000s PDAs (HP iPAQ h2200, h5xxx). The chip sits
  on a static-memory chip select as a plain memory-mapped 16-bit device,
  scans out of its own on-chip video memory and drives a fixed TFT panel's
  parallel RGB interface directly; the host SoC's LCD controller is not
  involved. Each part has so far only been found wired to one panel
  design, so the compatible also selects that panel's timing and
  flat-panel interface setup. The MQ1188 is register-compatible with the
  MQ1178 and uses its compatible.

properties:
  compatible:
    enum:
      - mediaq,mq1132
      - mediaq,mq1178

  reg:
    items:
      - description: The on-chip video memory window (256 KiB).
      - description:
          The register window (8 KiB), immediately after the video memory
          window.

  interrupts:
    maxItems: 1
    description:
      The chip's interrupt output, an active-low level. Its sources include
      the end of each frame, the falling edge of vertical display enable. A
      board that leaves the output unconnected omits the property.

  power-supply:
    description:
      The chip's main power supply. The driver enables it after vdd-supply
      and releases reset once it is up, so the supply's own startup delay
      must cover the time the chip needs before it can leave reset.

  vdd-supply:
    description:
      The chip's core supply, switched separately from power-supply on some
      boards. Enabled first, before power-supply.

  panel-supply:
    description:
      The attached panel's own supply, separate from the chip's. Enabled
      before the chip drives the panel interface and disabled before it
      stops, whenever the display is unblanked or blanked.

  reset-gpios:
    maxItems: 1
    description: The chip's own active-low reset line.

  backlight:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      The backlight that illuminates the attached panel, switched off
      whenever the display is blanked.

  "#pwm-cells":
    const: 3
    description:
      The chip has two internal PWM generators, PWM0 and PWM1, with an output
      pin each. A board can wire one to the panel's backlight, whose "pwms"
      then points back at this node. The cells are the generator (0 or 1), the
      period in nanoseconds and the flags.

required:
  - compatible
  - reg
  - power-supply

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    display@4000000 {
        compatible = "mediaq,mq1178";
        reg = <0x04000000 0x40000>, <0x04040000 0x2000>;
        interrupt-parent = <&gpio>;
        interrupts = <14 IRQ_TYPE_LEVEL_LOW>;
        vdd-supply = <&mq_vdd>;
        power-supply = <&mq_power>;
        reset-gpios = <&gpio 68 GPIO_ACTIVE_LOW>;
        backlight = <&backlight>;
    };

  - |
    #include <dt-bindings/gpio/gpio.h>

    mediaq: display@4000000 {
        compatible = "mediaq,mq1132";
        reg = <0x04000000 0x40000>, <0x04040000 0x2000>;
        power-supply = <&mq_power>;
        panel-supply = <&lcd_power>;
        backlight = <&backlight>;
        #pwm-cells = <3>;
    };

    backlight: backlight {
        compatible = "pwm-backlight";
        pwms = <&mediaq 0 1000000 0>;
        enable-gpios = <&gpio 38 GPIO_ACTIVE_HIGH>;
        brightness-levels = <0 120 250 500 1000>;
        default-brightness-level = <4>;
    };
